services:
  claude-code:
    build: .
    container_name: claude-code
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: ubuntu
    environment:
      - USER_ID=${UID:-1000}
      - GROUP_ID=${GID:-1000}
      - CLAUDE_CODE_DISABLE_AUTO_MEMORY=1

    volumes:
      # 現在のディレクトリをワークスペースとしてマウント
      - ${PWD}:${PWD}
      # 必要に応じて設定ファイルを個別に追加（例）
      # - ~/.gitconfig:/tmp/.gitconfig:ro
      - ~/.claude:/home/ubuntu/.claude
      - ~/.claude:/home/ubuntu/.config/claude
      - ~/.codex:/home/ubuntu/.codex
      - ~/.docker.claude.json:/home/ubuntu/.claude.json
      - ~/.gitconfig:/home/ubuntu/.gitconfig:ro
      - ~/.ivy2/cache:/home/ubuntu/.ivy2/cache
      - ../mcp-servers.json:/etc/claude-code/managed-mcp.json:ro

      - ../tools/tts-client/tts.sh:/usr/bin/tts:ro
      - ../commands/cc-notification:/usr/bin/cc-notification:ro
      - ../commands/cc-stop:/usr/bin/cc-stop:ro
      - ../commands/cc-pre-tool:/usr/bin/cc-pre-tool:ro
      - ../commands/cc-statusline:/usr/bin/cc-statusline:ro
    working_dir: ${PWD}
    stdin_open: true
    tty: true
    # デフォルトでbashシェルを起動
    command: ["bash"]
    network_mode: host
